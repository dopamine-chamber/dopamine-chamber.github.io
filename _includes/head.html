<head>

  {%- include cookie-consent.html -%}
  
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=0.6">
  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  {%- feed_meta -%}
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js"></script>

  <style> 
    .home-handstand { display: block; margin: 1.5rem auto; max-width: 100%; height: auto; }

    :is(article, .post-content, .page-content, main) p a,
    :is(article, .post-content, .page-content, main) li a {
      color: #a83222;
      font-style: normal;
      font-weight: 400;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    :is(article, .post-content, .page-content, main) p a:hover,
    :is(article, .post-content, .page-content, main) p a:focus,
    :is(article, .post-content, .page-content, main) li a:hover,
    :is(article, .post-content, .page-content, main) li a:focus {
      color: #822417;
      text-decoration-thickness: 2px;
    }
    
  </style>
  
</head>
