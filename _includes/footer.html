<footer class="site-footer h-card">
  <div class="wrapper" style="text-align: center;">

    <!-- Prima riga: Titolo -->
    <h2 class="footer-heading" style="float: none; font-size: 1.125rem; font-weight: normal; margin-bottom: 10px;">
      {{ site.title | escape }}
    </h2>

    <!-- Seconda riga: Copyright + Link Cliccabile -->
    <p style="margin-bottom: 10px; color: #828282;">
      {{ site.author | escape }} © | <a href="{{ '/privacy-policy/' | relative_url }}">Privacy Policy</a>
    </p>

    <!-- Terza riga: Descrizione -->
    <p style="color: #828282; margin-bottom: 0;">
      {{ site.description | escape }}
    </p>

  </div>
</footer>
