title: signals from noise
tagline: observe like a physicist · unpack like an engineer · experience like a practitioner
author: 2026 Slow Convergence. All rights are reserved
description: Observe like a physicist. Unpack like an engineer. Experience like a practitioner.
url: "https://www.slowconvergence.com"
baseurl: ""
theme: minima
lang: en

plugins:
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/home/home_preview.png

