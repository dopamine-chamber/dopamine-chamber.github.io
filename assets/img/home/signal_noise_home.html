<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>signals from noise</title>
<style>
  html,body{margin:0;height:100%;background:#04050a;overflow:hidden}
  #wrap{position:relative;width:100%;height:100%;min-height:260px}
  canvas{display:block;width:100%;height:100%}
  /* CRT scanlines + vignette */
  #wrap::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px),
               radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.75) 100%)}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" role="img" aria-label="Animated oscilloscope: a noisy signal and a prediction model that starts as a hallucination and converges toward it."></canvas></div>
<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const C = { sig: '#19f0ff', mod: '#ff2bd6', err: '#ffb000', txt: 'rgba(160,220,235,.6)' };
  const DT = 1 / 60, STEP = 1.6, FONT = '11px ui-monospace,Menlo,Consolas,monospace';
  const wn = 3.4, zeta = 0.28, EPOCH = 17, TAU = 4.2, SIGMA = 0.05;
  const STAGES = ['PREDICT', 'SENSE', 'ERROR', 'UPDATE'];
  const rnd = Math.random;
  const gauss = () => { let u = 0; for (let i = 0; i < 4; i++) u += rnd(); return (u - 2) * 1.73; };
  const ph = [rnd() * 6.28, rnd() * 6.28, rnd() * 6.28];
  const halluc = t => Math.sin(t * 5.1 + ph[0]) * .5 + Math.sin(t * 8.7 + ph[1]) * .3 + Math.sin(t * 13.3 + ph[2]) * .2;

  let W, H, dpr, plotW, N = 0, hist = [];
  let th = 0.05, om = 0, t = 0, nextKick = 1.2, epochT = 0, epoch = 1, glitch = 0, fc = 0, A = .4;

  // static noise layer
  const nc = document.createElement('canvas'); nc.width = 192; nc.height = 108;
  const nx = nc.getContext('2d'), id = nx.createImageData(192, 108);
  function noise() {
    const d = id.data;
    for (let i = 0; i < d.length; i += 4) { const v = rnd() * 255 | 0; d[i] = v * .4; d[i + 1] = v; d[i + 2] = v; d[i + 3] = rnd() < .5 ? 0 : 60; }
    nx.putImageData(id, 0, 0);
  }

  // reality = PD-stabilised inverted pendulum (damped oscillator) kicked by random perturbations
  function step() {
    t += DT; epochT += DT;
    if (t > nextKick) { om += (rnd() < .5 ? -1 : 1) * (.6 + rnd() * .9); nextKick = t + 2 + rnd() * 2.4; glitch = .25; }
    om += (-2 * zeta * wn * om - wn * wn * th) * DT; th += om * DT;
    if (epochT > EPOCH) { epochT = 0; epoch++; glitch = .6; for (let i = 0; i < 3; i++) ph[i] = rnd() * 6.28; }
    A = .38 * Math.exp(-epochT / TAU) + .012;               // hallucination amplitude: learning
    hist.push({ r: th, m: th + A * halluc(t), y1: th + gauss() * SIGMA * (.6 + rnd()), y2: th + gauss() * SIGMA * 1.6 });
    if (hist.length > N) hist.shift();
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(4,5,10,.42)'; ctx.fillRect(0, 0, W, H);
    if (++fc % 3 === 0) noise();
    ctx.imageSmoothingEnabled = false; ctx.globalAlpha = .55; ctx.drawImage(nc, 0, 0, W, H); ctx.globalAlpha = 1;

    const cy = H * .5, ys = H * .55, n = hist.length, x0 = plotW - (n - 1) * STEP, X = i => x0 + i * STEP;

    // grid
    ctx.strokeStyle = 'rgba(25,240,255,.07)'; ctx.lineWidth = 1; ctx.beginPath();
    for (let g = -3; g <= 3; g++) { const y = cy + g * H * .12; ctx.moveTo(0, y); ctx.lineTo(plotW, y); }
    for (let x = plotW - (t * 60 * STEP) % 60; x > 0; x -= 60) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    ctx.stroke();
    ctx.setLineDash([4, 6]); ctx.strokeStyle = 'rgba(25,240,255,.3)'; ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(plotW, cy); ctx.stroke(); ctx.setLineDash([]);

    // error band between model and reality
    ctx.beginPath();
    for (let i = 0; i < n; i++) ctx[i ? 'lineTo' : 'moveTo'](X(i), cy - hist[i].m * ys);
    for (let i = n - 1; i >= 0; i--) ctx.lineTo(X(i), cy - hist[i].r * ys);
    ctx.closePath(); ctx.fillStyle = 'rgba(255,176,0,.13)'; ctx.fill();

    // noisy measurements
    for (let i = 0; i < n; i++) {
      const h = hist[i], x = X(i);
      ctx.fillStyle = 'rgba(200,245,255,.5)'; ctx.fillRect(x, cy - h.y1 * ys, 1.5, 1.5);
      ctx.fillStyle = 'rgba(120,200,255,.28)'; ctx.fillRect(x, cy - h.y2 * ys, 1.5, 1.5);
    }

    // model (hallucination) and reality (signal)
    ctx.lineWidth = 1.2; ctx.strokeStyle = C.mod; ctx.beginPath();
    for (let i = 0; i < n; i++) ctx[i ? 'lineTo' : 'moveTo'](X(i), cy - hist[i].m * ys);
    ctx.stroke();
    ctx.lineWidth = 2; ctx.strokeStyle = C.sig; ctx.shadowColor = C.sig; ctx.shadowBlur = 10; ctx.beginPath();
    for (let i = 0; i < n; i++) ctx[i ? 'lineTo' : 'moveTo'](X(i), cy - hist[i].r * ys);
    ctx.stroke(); ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(plotW, cy - th * ys, 3, 0, 7); ctx.fill();

    // fade left edge
    const g = ctx.createLinearGradient(0, 0, 90, 0); g.addColorStop(0, 'rgba(4,5,10,1)'); g.addColorStop(1, 'rgba(4,5,10,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, 90, H);

    // HUD
    let e = 0, r = 0; const k = Math.min(n, 120);
    for (let i = n - k; i < n; i++) { const d = hist[i].m - hist[i].r; if (i >= n - 60) e += d * d; r += hist[i].r * hist[i].r; }
    e = Math.sqrt(e / Math.min(k, 60)); r = Math.sqrt(r / k);
    const snr = 20 * Math.log10(Math.max(r, 1e-3) / SIGMA);
    ctx.fillStyle = C.sig; ctx.fillText('SIGNALS_FROM_NOISE' + (Math.floor(t * 2) % 2 ? '_' : ' '), 14, 22);
    ctx.fillStyle = C.mod; ctx.fillText('model: ' + (A > .2 ? 'HALLUCINATING' : A > .06 ? 'CONVERGING' : 'LOCKED'), 14, 40);
    ctx.fillStyle = C.txt;
    ctx.fillText('theta ' + th.toFixed(3) + ' rad', 14, 58);
    ctx.fillText('error ' + e.toFixed(3) + ' rms', 14, 72);
    ctx.fillText('snr   ' + (snr >= 0 ? '+' : '') + snr.toFixed(1) + ' dB', 14, 86);
    ctx.fillText('epoch ' + String(epoch).padStart(3, '0'), 14, 100);

    // feedback loop
    const act = Math.floor(t * 2) % 4, by = H - 30;
    STAGES.forEach((s, i) => {
      const bx = 14 + i * 74;
      ctx.strokeStyle = i === act ? C.mod : 'rgba(160,220,235,.25)'; ctx.strokeRect(bx, by, 66, 16);
      if (i === act) { ctx.fillStyle = 'rgba(255,43,214,.22)'; ctx.fillRect(bx, by, 66, 16); }
      ctx.fillStyle = i === act ? '#fff' : C.txt; ctx.fillText(s, bx + 8, by + 12);
    });
    if (W >= 620) { ctx.fillStyle = C.txt; ctx.textAlign = 'right'; ctx.fillText('reality disagrees / error is data / repeat', plotW - 14, H - 17); ctx.textAlign = 'left'; }

    // glitch slices on perturbations and epoch resets
    if (glitch > 0) {
      for (let j = 0; j < 4; j++) {
        const sy = rnd() * H, sh = 6 + rnd() * 30;
        ctx.drawImage(cv, 0, sy * dpr, cv.width, sh * dpr, (rnd() - .5) * 240 * glitch, sy, W, sh);
      }
      glitch = Math.max(0, glitch - DT * 1.5);
    }
  }

  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2); W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#04050a'; ctx.fillRect(0, 0, cv.width, cv.height);
    plotW = W - 24; N = Math.ceil(plotW / STEP) + 2;
    if (hist.length < N) for (let i = hist.length; i < N; i++) step();
    if (reduce) draw();
  }

  let last = 0, acc = 0;
  function frame(ts) {
    acc += Math.min((ts - last) / 1000, .1); last = ts;
    while (acc >= DT) { step(); acc -= DT; }
    draw(); requestAnimationFrame(frame);
  }

  addEventListener('resize', resize);
  resize();
  if (!reduce) requestAnimationFrame(ts => { last = ts; frame(ts); });
})();
</script>
</body>
</html>
