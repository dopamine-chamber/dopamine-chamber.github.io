<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>signals from noise · learning that diverges</title>
<style>
  html,body{margin:0;height:100%;background:#04050a;overflow:hidden}
  #wrap{position:relative;width:100%;height:100%;min-height:260px}
  canvas{display:block;width:100%;height:100%}
  /* CRT scanlines + vignette */
  #wrap::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px),
               radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.75) 100%)}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" role="img" aria-label="Animation: a learning model overshoots at every update. Its error grows, it swings ever further from the real signal, and it explodes."></canvas></div>
<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const C = { sig: '#19f0ff', mod: '#ff2bd6', err: '#ffb000', txt: 'rgba(160,220,235,.6)' };
  const DT = 1 / 60, FONT = '11px ui-monospace,Menlo,Consolas,monospace';
  const rnd = Math.random;
  const gauss = () => { let u = 0; for (let i = 0; i < 4; i++) u += rnd(); return (u - 2) * 1.73; };

  // Toy model of learning: gradient descent on a two-weight quadratic loss.
  // Stable only while (step size x largest curvature) < 2.
  const DIVERGE = true;
  const GAIN = 2.18;                     // step size x largest curvature
  const L1 = 1, L2 = .09;                    // curvatures of the loss valley
  const ANG = -.6, V1 = [Math.cos(ANG), Math.sin(ANG)], V2 = [-Math.sin(ANG), Math.cos(ANG)];
  const STAR = [.62, .42], EVERY = .42, LIMIT = 1.5, BOX = 1.3;

  let W, H, dpr, t = 0, fc = 0, glitch = 0, epoch = 0;
  let a, b, pa, pb, k, since, path, state, stateT;
  let parts = [], rip = [];
  let wave, map;                             // layout boxes

  // static noise layer
  const nc = document.createElement('canvas'); nc.width = 192; nc.height = 108;
  const nx = nc.getContext('2d'), img = nx.createImageData(192, 108);
  function noise() {
    const d = img.data;
    for (let i = 0; i < d.length; i += 4) { const v = rnd() * 255 | 0; d[i] = v * .4; d[i + 1] = v; d[i + 2] = v; d[i + 3] = rnd() < .5 ? 0 : 60; }
    nx.putImageData(img, 0, 0);
  }

  // error in eigen-coordinates (a: steep axis, b: shallow axis) -> weights
  const weights = (ea, eb) => [STAR[0] + ea * V1[0] + eb * V2[0], STAR[1] + ea * V1[1] + eb * V2[1]];
  const loss = (ea, eb) => .5 * (L1 * ea * ea + L2 * eb * eb);
  const current = () => {
    const u = Math.min(since / (EVERY * .6), 1), s = u * u * (3 - 2 * u);
    return [pa + (a - pa) * s, pb + (b - pb) * s];
  };

  function reset() {
    epoch++; k = 0; since = 0; state = 'run'; stateT = 0;
    const sign = rnd() < .5 ? -1 : 1;
    a = pa = sign * (DIVERGE ? .07 : .5); b = pb = -sign * (DIVERGE ? .5 : .95);
    path = [weights(a, b)];
    if (epoch > 1) glitch = .5;
  }

  function update() {
    const jit = DIVERGE ? .006 : .014 * Math.exp(-k / 9);
    pa = a; pb = b;
    a = a * (1 - GAIN * L1) + gauss() * jit;
    b = b * (1 - GAIN * L2 / L1) + gauss() * jit;
    k++; since = 0; path.push(weights(a, b));
    if (DIVERGE) glitch = Math.max(glitch, Math.min(.35, Math.abs(a) * .22));
  }

  // wave drawn from the weights: w1 and w2 set the amplitude of two components
  const curve = (x, w) => (w[0] * Math.sin(x * 9.4 - t * 1.4) + w[1] * Math.sin(x * 22 - t * 2.6)) * .8;
  const WX = u => wave.x + u * wave.w, WY = v => wave.y - v * wave.h;
  const MX = w => map.x + (w[0] - STAR[0]) / BOX * map.r, MY = w => map.y - (w[1] - STAR[1]) / BOX * map.r;

  function explode() {
    state = 'dead'; stateT = 0; glitch = 1;
    const w = weights(a, b);
    const burst = (x, y, col, sp) => {
      const ang = rnd() * 6.283, v = sp * (.2 + rnd());
      parts.push({ x, y, vx: Math.cos(ang) * v, vy: Math.sin(ang) * v, col, life: 1 + rnd() * 1.4, age: 0, s: 1 + rnd() * 3 });
    };
    for (let i = 0; i <= 180; i++) {
      const u = i / 180, y = Math.max(8, Math.min(H - 8, WY(curve(u, w))));
      burst(WX(u), y, i % 5 ? C.mod : C.err, 170);
    }
    const hx = Math.max(map.x - map.r, Math.min(map.x + map.r, MX(w)));
    const hy = Math.max(map.y - map.r, Math.min(map.y + map.r, MY(w)));
    for (let i = 0; i < 90; i++) burst(hx, hy, i % 3 ? C.mod : '#fff', 220);
    rip.push({ x: hx, y: hy, t0: t, col: C.mod }, { x: wave.x + wave.w / 2, y: wave.y, t0: t + .15, col: C.err });
  }

  function step() {
    t += DT; stateT += DT; since += DT;
    if (state === 'run') {
      if (since >= EVERY) {
        update();
        if (DIVERGE && Math.hypot(a, b * .4) > LIMIT) explode();
        else if (!DIVERGE && loss(a, b) < .00003) { state = 'locked'; stateT = 0; rip.push({ x: map.x, y: map.y, t0: t, col: C.sig }); }
      }
    } else if (state === 'locked') {
      if (since >= EVERY) { update(); if (k % 4 === 0) rip.push({ x: map.x, y: map.y, t0: t, col: C.sig }); }
      if (stateT > 4) reset();
    } else if (stateT > 3) reset();
    for (const p of parts) { p.age += DT; p.x += p.vx * DT; p.y += p.vy * DT; p.vx *= .985; p.vy *= .985; }
    parts = parts.filter(p => p.age < p.life);
    rip = rip.filter(r => t - r.t0 < 1.6);
  }

  function drawMap(e) {
    const { x, y, r } = map;
    ctx.save(); ctx.beginPath(); ctx.rect(x - r, y - r, 2 * r, 2 * r); ctx.clip();
    ctx.lineWidth = 1;
    for (let i = 1; i <= 7; i++) {
      const lv = i * .23 / BOX * r;
      ctx.strokeStyle = 'rgba(25,240,255,' + (.3 - i * .03) + ')';
      ctx.beginPath(); ctx.ellipse(x, y, lv * .5, lv * .5 * Math.sqrt(L1 / L2), -ANG, 0, 6.283); ctx.stroke();
    }
    const head = weights(e[0], e[1]), pts = state === 'dead' ? path : path.slice(0, -1).concat([head]);
    for (let i = 1; i < pts.length; i++) {
      ctx.strokeStyle = C.mod; ctx.globalAlpha = .25 + .75 * i / pts.length; ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.moveTo(MX(pts[i - 1]), MY(pts[i - 1])); ctx.lineTo(MX(pts[i]), MY(pts[i])); ctx.stroke();
      ctx.fillStyle = C.mod; ctx.fillRect(MX(pts[i - 1]) - 1.5, MY(pts[i - 1]) - 1.5, 3, 3);
    }
    ctx.globalAlpha = 1;
    // the target: where the loss is zero
    ctx.strokeStyle = C.sig; ctx.shadowColor = C.sig; ctx.shadowBlur = 8; ctx.beginPath();
    ctx.moveTo(x - 6, y); ctx.lineTo(x + 6, y); ctx.moveTo(x, y - 6); ctx.lineTo(x, y + 6); ctx.stroke(); ctx.shadowBlur = 0;
    if (state !== 'dead') { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(MX(head), MY(head), 3, 0, 7); ctx.fill(); }
    ctx.restore();
    ctx.strokeStyle = state === 'dead' ? 'rgba(255,43,214,.7)' : 'rgba(160,220,235,.22)'; ctx.strokeRect(x - r + .5, y - r + .5, 2 * r - 1, 2 * r - 1);
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.globalAlpha = 1; ctx.font = FONT; ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(4,5,10,.42)'; ctx.fillRect(0, 0, W, H);
    if (++fc % 3 === 0) noise();
    ctx.imageSmoothingEnabled = false; ctx.globalAlpha = .55; ctx.drawImage(nc, 0, 0, W, H); ctx.globalAlpha = 1;

    const e = current(), w = weights(e[0], e[1]), N = 150;

    // zero line
    ctx.setLineDash([4, 6]); ctx.strokeStyle = 'rgba(25,240,255,.3)'; ctx.lineWidth = 1; ctx.beginPath();
    ctx.moveTo(wave.x, wave.y); ctx.lineTo(wave.x + wave.w, wave.y); ctx.stroke(); ctx.setLineDash([]);

    if (state !== 'dead') {
      // error band
      ctx.beginPath();
      for (let i = 0; i <= N; i++) ctx[i ? 'lineTo' : 'moveTo'](WX(i / N), WY(curve(i / N, w)));
      for (let i = N; i >= 0; i--) ctx.lineTo(WX(i / N), WY(curve(i / N, STAR)));
      ctx.closePath(); ctx.fillStyle = 'rgba(255,176,0,.15)'; ctx.fill();
    }
    // noisy measurements
    ctx.fillStyle = 'rgba(200,245,255,.45)';
    for (let i = 0; i <= N; i += 2) ctx.fillRect(WX(i / N), WY(curve(i / N, STAR) + gauss() * .09), 1.5, 1.5);
    // model
    if (state !== 'dead') {
      ctx.lineWidth = 1.3; ctx.strokeStyle = C.mod; ctx.shadowColor = C.mod; ctx.shadowBlur = DIVERGE ? Math.min(14, Math.abs(e[0]) * 12) : 0; ctx.beginPath();
      const tear = DIVERGE ? Math.max(0, Math.abs(e[0]) - .35) * .16 : 0;
      for (let i = 0; i <= N; i++) ctx[i ? 'lineTo' : 'moveTo'](WX(i / N), WY(curve(i / N, w) + (rnd() - .5) * tear));
      ctx.stroke(); ctx.shadowBlur = 0;
    }
    // reality
    ctx.lineWidth = 2; ctx.strokeStyle = C.sig; ctx.shadowColor = C.sig; ctx.shadowBlur = 10; ctx.beginPath();
    for (let i = 0; i <= N; i++) ctx[i ? 'lineTo' : 'moveTo'](WX(i / N), WY(curve(i / N, STAR)));
    ctx.stroke(); ctx.shadowBlur = 0;

    drawMap(e);

    // shockwaves and debris
    for (const r of rip) {
      const u = (t - r.t0) / 1.4; if (u < 0 || u > 1) continue;
      ctx.strokeStyle = r.col; ctx.globalAlpha = .6 * (1 - u); ctx.lineWidth = DIVERGE ? 2 : 1;
      ctx.beginPath(); ctx.arc(r.x, r.y, 6 + (DIVERGE ? Math.max(W, H) * .6 : 60) * u, 0, 7); ctx.stroke();
    }
    for (const p of parts) { ctx.globalAlpha = Math.max(0, 1 - p.age / p.life); ctx.fillStyle = p.col; ctx.fillRect(p.x, p.y, p.s, p.s); }
    ctx.globalAlpha = 1;

    // HUD
    const l = loss(e[0], e[1]);
    const status = state === 'dead' ? 'EXPLODED' : state === 'locked' ? 'LOCKED' : DIVERGE ? 'DIVERGING' : 'CONVERGING';
    ctx.fillStyle = C.sig; ctx.fillText('SIGNALS_FROM_NOISE // LEARNING' + (Math.floor(t * 2) % 2 ? '_' : ' '), 14, 22);
    ctx.fillStyle = C.mod; ctx.fillText('model: ' + status, 14, 40);
    ctx.fillStyle = C.txt;
    ctx.fillText('step  ' + String(k).padStart(3, '0') + '   epoch ' + String(epoch).padStart(3, '0'), 14, 58);
    ctx.fillText('loss  ' + (state === 'dead' ? 'inf' : l.toFixed(4)), 14, 72);
    ctx.fillText('rate  ' + GAIN.toFixed(2) + '  (limit 2.00)', 14, 86);
    if (state === 'dead' && Math.floor(stateT * 5) % 4 !== 3) {
      ctx.font = 'bold ' + Math.round(Math.min(28, W / 15)) + 'px ui-monospace,Menlo,Consolas,monospace'; ctx.textAlign = 'center';
      const cx = wave.x + wave.w / 2, cy = wave.y;
      ctx.fillStyle = C.sig; ctx.fillText('MODEL LOST', cx - 2, cy); ctx.fillStyle = C.mod; ctx.fillText('MODEL LOST', cx + 2, cy);
      ctx.fillStyle = '#fff'; ctx.fillText('MODEL LOST', cx, cy); ctx.font = FONT; ctx.textAlign = 'left';
    }

    // glitch slices
    if (glitch > 0) {
      for (let j = 0; j < 4; j++) {
        const sy = rnd() * H, sh = 6 + rnd() * 30;
        ctx.drawImage(cv, 0, sy * dpr, cv.width, sh * dpr, (rnd() - .5) * 240 * glitch, sy, W, sh);
      }
      glitch = Math.max(0, glitch - DT * 1.5);
    }
  }

  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2); W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#04050a'; ctx.fillRect(0, 0, cv.width, cv.height);
    if (W >= 520) {
      const r = Math.min(W * .15, H * .36);
      map = { x: W - r - 20, y: H * .5, r };
      wave = { x: 14, y: H * .62, w: map.x - r - 34, h: H * .17 };
    } else {
      const r = Math.min(W * .15, 52);
      map = { x: W - r - 12, y: r + 40, r };
      const top = Math.max(map.y + r + 24, 100);
      wave = { x: 14, y: (top + H - 28) / 2, w: W - 28, h: (H - 28 - top) * .36 };
    }
    parts = []; rip = [];
    if (reduce) draw();
  }

  let last = 0, acc = 0;
  function frame(ts) {
    acc += Math.min((ts - last) / 1000, .1); last = ts;
    while (acc >= DT) { step(); acc -= DT; }
    draw(); requestAnimationFrame(frame);
  }

  addEventListener('resize', resize);
  reset(); resize();
  if (reduce) {                              // one still frame that tells the story
    let n = 0; const target = DIVERGE ? 'dead' : 'locked';
    while (state !== target && n++ < 3000) step();
    for (let i = 0; i < 18; i++) step();
    glitch = 0; for (let i = 0; i < 8; i++) draw();
  } else requestAnimationFrame(ts => { last = ts; frame(ts); });
})();
</script>
</body>
</html>
