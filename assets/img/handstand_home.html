<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The handstand dilemma</title>
<style>
  :root {
    --bg: #ffffff;
    --ink: #2a2a2a;
    --ground: #2a2a2a;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #141414; --ink: #ededed; --ground: #ededed; }
  }
  :root[data-theme="dark"] { --bg: #141414; --ink: #ededed; --ground: #ededed; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); overflow: hidden; }
  svg { display: block; width: 100%; height: 100%; cursor: pointer; }
  .line { fill: none; stroke: var(--ink); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  .hand { fill: none; stroke: var(--ink); stroke-width: 7; stroke-linecap: round; }
  .joint { fill: var(--bg); stroke: var(--ink); stroke-width: 3; }
  .head { fill: var(--bg); stroke: var(--ink); stroke-width: 3.5; }
  .floor { stroke: var(--ground); stroke-width: 1.6; stroke-linecap: round; }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Un omino stilizzato entra con una ruota e resta in verticale sulle mani, a gambe leggermente divaricate. Clicca per rivedere l'animazione.">
  <defs>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="0" x2="1200" y1="0" y2="0">
      <stop offset="0" stop-color="#888" stop-opacity="0"/>
      <stop offset=".22" stop-color="#888" stop-opacity="1"/>
      <stop offset=".78" stop-color="#888" stop-opacity="1"/>
      <stop offset="1" stop-color="#888" stop-opacity="0"/>
    </linearGradient>
    <mask id="floorMask" maskUnits="userSpaceOnUse" x="-2000" y="0" width="5000" height="700">
      <rect id="floorFade" x="0" y="0" width="1200" height="700" fill="url(#fade)"/>
    </mask>
  </defs>
  <line id="floor" class="floor" x1="0" y1="620" x2="1200" y2="620" mask="url(#floorMask)"/>
  <path id="body" class="line" d=""/>
  <path id="hands" class="hand" d=""/>
  <g id="joints"></g>
  <circle id="head" class="head" r="14"/>
</svg>

<script>
(function () {
  var svg = document.getElementById('stage');
  var NS = 'http://www.w3.org/2000/svg';
  var GROUND = 620, K = 140;                       // altezza del suolo, px percorsi per radiante
  var B = { arm: 95, torso: 125, thigh: 110, shin: 110, sw: 20, hw: 11, neck: 30, headR: 14 };
  var D = 4.6;                                     // durata della ruota (s)
  var PHI1 = 540 * Math.PI / 180;                  // 1,5 giri: finisce capovolto
  var W = 1200, cx = 600, phi0 = 0;

  var bodyEl = document.getElementById('body');
  var handsEl = document.getElementById('hands');
  var headEl = document.getElementById('head');
  var jointsEl = document.getElementById('joints');
  var floorEl = document.getElementById('floor');
  var floorFade = document.getElementById('floorFade');
  var fadeGrad = document.getElementById('fade');
  var joints = [];
  for (var i = 0; i < 6; i++) {
    var c = document.createElementNS(NS, 'circle');
    c.setAttribute('class', 'joint'); c.setAttribute('r', 6);
    jointsEl.appendChild(c); joints.push(c);
  }

  function layout() {
    var asp = window.innerWidth / Math.max(window.innerHeight, 1);
    W = Math.min(1200, Math.max(700, Math.round(700 * asp)));
    svg.setAttribute('viewBox', '0 0 ' + W + ' 700');
    cx = W / 2;
    floorEl.setAttribute('x2', W);
    floorFade.setAttribute('width', W);
    fadeGrad.setAttribute('x2', W);
    phi0 = PHI1 - (cx + 300) / K;                  // parte appena fuori dallo schermo
    if (phi0 < 0.5) phi0 = 0.5;
  }

  function smooth(x, a, b) { var t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); }
  function rot(p, c, s) { return [p[0] * c - p[1] * s, p[0] * s + p[1] * c]; }

  function draw(t) {
    var s = Math.min(1, t / D);
    var e = 1 - Math.pow(1 - s, 2.4);              // parte veloce, si ferma piano in verticale
    var phi = phi0 + (PHI1 - phi0) * e;
    var deg = phi * 180 / Math.PI;
    var close = smooth(deg, 420, 540);
    var a = (150 + 30 * close) * Math.PI / 180;    // braccia: alte e aperte -> parallele
    var l = (30 - 21 * close) * Math.PI / 180;     // gambe: a stella -> poco divaricate

    // figura in piedi, origine al bacino, y verso il basso
    var P = {}, sd = [-1, 1];
    P.sh = sd.map(function (k) { return [k * B.sw, -B.torso]; });
    P.hip = sd.map(function (k) { return [k * B.hw, 0]; });
    P.hand = sd.map(function (k, i) { return [P.sh[i][0] + B.arm * k * Math.sin(a), P.sh[i][1] + B.arm * Math.cos(a)]; });
    P.knee = sd.map(function (k, i) { return [P.hip[i][0] + B.thigh * k * Math.sin(l), B.thigh * Math.cos(l)]; });
    P.foot = sd.map(function (k, i) { return [P.knee[i][0] + B.shin * k * Math.sin(l), P.knee[i][1] + B.shin * Math.cos(l)]; });
    P.neck = [0, -B.torso];
    P.headC = [0, -B.torso - B.neck];

    var c = Math.cos(phi), sn = Math.sin(phi), R = {};
    Object.keys(P).forEach(function (k) {
      R[k] = Array.isArray(P[k][0]) ? P[k].map(function (p) { return rot(p, c, sn); }) : rot(P[k], c, sn);
    });

    // il punto più basso appoggia a terra
    var maxY = R.headC[1] + B.headR;
    R.hand.concat(R.foot).forEach(function (p) { if (p[1] > maxY) maxY = p[1]; });
    var hx = cx + K * (phi - PHI1), hy = GROUND - maxY;

    // oscillazione di equilibrio dopo l'arrivo
    var sway = 0;
    if (t > D) {
      var u = t - D;
      sway = (0.5 + 3 * Math.exp(-u / 0.9)) * Math.sin(1.7 * u) * Math.PI / 180;
    }
    var sc = Math.cos(sway), ss = Math.sin(sway), px = cx, py = GROUND;
    function T(p) {
      var x = p[0] + hx - px, y = p[1] + hy - py;
      return [x * sc - y * ss + px, x * ss + y * sc + py];
    }
    function f(p) { return p[0].toFixed(1) + ' ' + p[1].toFixed(1); }

    var d = '';
    [0, 1].forEach(function (i) {
      d += 'M' + f(T(R.hand[i])) + 'L' + f(T(R.sh[i])) + 'L' + f(T(R.neck));       // braccio + spalla
      d += 'M' + f(T(R.hip[i])) + 'L' + f(T(R.knee[i])) + 'L' + f(T(R.foot[i]));   // gamba
    });
    d += 'M' + f(T(R.neck)) + 'L' + f(T([0, 0]));                                  // busto
    d += 'M' + f(T(R.hip[0])) + 'L' + f(T(R.hip[1]));                              // bacino
    d += 'M' + f(T(R.neck)) + 'L' + f(T(R.headC));                                 // collo
    bodyEl.setAttribute('d', d);

    var h = '';
    R.hand.forEach(function (p) {
      var q = T(p);
      if (q[1] > GROUND - 6) h += 'M' + (q[0] - 12).toFixed(1) + ' ' + GROUND + 'L' + (q[0] + 12).toFixed(1) + ' ' + GROUND;
    });
    handsEl.setAttribute('d', h);

    var js = [R.sh[0], R.sh[1], R.hip[0], R.hip[1], R.knee[0], R.knee[1]];
    js.forEach(function (p, i) {
      var q = T(p); joints[i].setAttribute('cx', q[0].toFixed(1)); joints[i].setAttribute('cy', q[1].toFixed(1));
    });
    var hc = T(R.headC);
    headEl.setAttribute('cx', hc[0].toFixed(1)); headEl.setAttribute('cy', hc[1].toFixed(1));
  }

  var t0 = 0, raf = 0;
  var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function frame(now) {
    if (!t0) t0 = now;
    draw((now - t0) / 1000);
    raf = requestAnimationFrame(frame);
  }
  function start() {
    cancelAnimationFrame(raf); t0 = 0;
    if (still) { draw(D); return; }
    raf = requestAnimationFrame(frame);
  }

  layout(); start();
  window.addEventListener('resize', function () { layout(); if (still) draw(D); });
  svg.addEventListener('click', start);
})();
</script>
</body>
</html>
